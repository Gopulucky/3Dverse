name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      # Isolated tests include local persistence fixtures, not a deployed DB/provider.
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:critical
      - run: npm run lint:performance
      - run: npm run test:unit
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_PUBLIC_BUG_DETECTOR: "0"
      # Browser binary only, cached per Playwright version. The runner image already
      # has Chromium's system libraries, so `--with-deps` is skipped: it runs apt
      # against Ubuntu mirrors that can hang for minutes on DNS failures.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for browser checks
        run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:performance
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:browser
        env:
          BROWSER_CHANNEL: chromium
