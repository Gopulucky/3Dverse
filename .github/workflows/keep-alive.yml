name: Keep API awake

# Free hosting tiers put the API to sleep after ~15 minutes without traffic, and
# the first visitor then waits up to a minute for it to wake. A ping every 10
# minutes keeps it warm at no cost. Safe to delete if the API moves to an
# always-on plan.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 60 https://threedverse.onrender.com/health
