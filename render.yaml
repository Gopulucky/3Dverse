services:
  - type: web
    name: 3dverse-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Mount Admin credentials securely or supply workload identity separately.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CHECKOUT_SHIPPING_INR
        sync: false
      - key: ALLOW_MOCK_PAYMENTS
        value: "false"
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: POSTGRES_SERVER
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      # Any S3-compatible store (e.g. Supabase Storage). The public bucket holds
      # images shown on the site; AWS_BUCKET_NAME stays private for paid models.
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_PUBLIC_BUCKET_NAME
        sync: false
      - key: AWS_PUBLIC_BASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: 3dverse-redis
          property: connectionString

  - type: worker
    name: 3dverse-celery-worker
    runtime: python
    plan: starter
    rootDir: backend
    # Only the worker computes embeddings, so only it installs sentence-transformers.
    buildCommand: pip install -r requirements-worker.txt
    startCommand: celery -A app.core.celery_app worker --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: POSTGRES_SERVER
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: 3dverse-redis
          property: connectionString

  - type: worker
    name: 3dverse-celery-beat
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: POSTGRES_SERVER
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: 3dverse-redis
          property: connectionString

  - type: redis
    name: 3dverse-redis
    plan: starter
    ipAllowList: []
